# Security headers for wahealth.konnorkooi.com (static Next.js export).
#
# nginx gotcha: an `add_header` inside a `location` block REPLACES all
# inherited add_header directives. So this file is `include`d both at the
# server level AND inside any location that sets its own headers (e.g. the
# caching blocks), to guarantee these are always present.

add_header X-Content-Type-Options  "nosniff" always;
add_header X-Frame-Options         "DENY" always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# --- Content Security Policy ---
#
# The map WILL RENDER BLANK if the tile host is not allowed here. MapLibre
# fetches its style JSON, vector tiles, glyphs and sprites over XHR from
# tiles.openfreemap.org, and rasterises tiles inside a blob: worker.
#
# If you change NEXT_PUBLIC_MAP_STYLE_URL to a different tile provider, you
# must update connect-src (and img-src, for raster tile providers) to match.
#
# 'unsafe-inline' is required in two places and cannot be removed here:
#
#   script-src: a Next.js static export bootstraps hydration with inline
#     <script> tags (self.__next_f.push(...)) carrying the server-rendered
#     payload. Without 'unsafe-inline' every one is blocked and the page never
#     hydrates — no map, no filters. A nonce is the usual alternative, but
#     nonces require a server to generate them per request, and this is a
#     static export served by nginx. Hashes would work but change on every
#     build, so they'd have to be regenerated by the deploy.
#
#   style-src: MapLibre sets inline styles on the marker and control elements
#     it creates at runtime.
add_header Content-Security-Policy "\
default-src 'self'; \
script-src 'self' 'unsafe-inline'; \
worker-src 'self' blob:; \
child-src 'self' blob:; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data: blob:; \
font-src 'self' data:; \
connect-src 'self' https://tiles.openfreemap.org; \
frame-ancestors 'none'; \
base-uri 'self'; \
form-action 'self'; \
object-src 'none'\
" always;
